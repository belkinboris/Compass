name: Тесты

# ЭКОНОМНЫЙ РЕЖИМ (5 октября 2026, перед закрытием репозитория). У открытого
# репозитория минуты GitHub Actions бесплатны без счёта, у закрытого на
# бесплатном тарифе — 2000 в месяц. Пушей в main 35–45 в сутки (рутины
# коммитят данные несколько раз в час), один полный прогон — около 11 минут:
# квота кончилась бы за 4–5 дней. Поэтому:
#   * быстрые проверки (инварианты базы и API, ~30 с) — на каждый push, как
#     раньше: данные меняются чаще всего, и ловить поломку нужно сразу;
#   * интерфейс (Playwright, ~10 минут) — раз в сутки, на pull request и по
#     кнопке «Run workflow». Перед каждым коммитом полный pytest всё равно
#     гоняется локально (правило проекта), здесь — страховка.
# Около 1 минуты × 35 пушей + 11 минут × 30 ночей ≈ 1400 минут в месяц.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'   # 05:30 МСК
  workflow_dispatch:

jobs:
  data:
    name: Данные и API (без браузера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          # pymorphy3 — нормализация падежа предмета сделки (pipeline/ingest/casing.py),
          # нужна только конвейеру притока, requirements.txt — список для боевого
          # хоста (Timeweb), где её никто не импортирует. Та же логика, что в
          # .claude/hooks/session-start.sh — держим установку в одном месте, не
          # смешиваем с requirements.txt.
          pip install pymorphy3 pymorphy3-dicts-ru
      - name: Инварианты базы
        run: python -m pytest test_data.py -q
      - name: yandex_search и /api/ask
        run: python -m pytest test_kompas.py -q

  ui:
    name: Интерфейс (Playwright)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright
      # Локально браузер предустановлен и ставить его запрещено; здесь чистая
      # машина, поэтому Chromium ставится явно — с системными библиотеками.
      - name: Поставить Chromium
        run: python -m playwright install --with-deps chromium
      - name: Дымовые тесты экранов
        run: python -m pytest test_ui.py -q
