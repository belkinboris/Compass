name: Тесты

# Гоняем на каждый push и pull request в main и в рабочую ветку.
# Два джоба, а не один: инварианты базы должны отвечать за секунды и падать
# первыми — из-за них чинить проще всего. Дымовые тесты интерфейса требуют
# браузера и идут полторы минуты, поэтому вынесены отдельно и не задерживают
# быстрый ответ.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  data:
    name: Данные и API (без браузера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          # pymorphy3 — нормализация падежа предмета сделки (pipeline/ingest/casing.py),
          # нужна только конвейеру притока, requirements.txt — список для боевого
          # хоста (Timeweb), где её никто не импортирует. Та же логика, что в
          # .claude/hooks/session-start.sh — держим установку в одном месте, не
          # смешиваем с requirements.txt.
          pip install pymorphy3 pymorphy3-dicts-ru
      - name: Инварианты базы
        run: python -m pytest test_data.py -q
      # До 28 октября 2026 джоб гонял только test_data и test_kompas — 3 файла из
      # 29 (аудит кода): приток, модерация, документы, аналитика, аккаунты и
      # остальное на GitHub не проверялись вовсе.
      - name: Все остальные тесты без браузера
        run: python -m pytest -q --ignore=test_ui.py --ignore=test_data.py

  ui:
    name: Интерфейс (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright
      # Локально браузер предустановлен и ставить его запрещено; здесь чистая
      # машина, поэтому Chromium ставится явно — с системными библиотеками.
      - name: Поставить Chromium
        run: python -m playwright install --with-deps chromium
      - name: Дымовые тесты экранов
        run: python -m pytest test_ui.py -q
